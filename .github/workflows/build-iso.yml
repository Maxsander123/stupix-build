name: Build Stupix ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install live-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-common \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools

      - name: Build ISO
        run: |
          chmod +x auto/config auto/build auto/clean
          sudo ./auto/config
          sudo lb build 2>&1 | tee build.log

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stupix-live-iso
          path: live-image-amd64.hybrid.iso
          retention-days: 30

      - name: Upload Build Log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
