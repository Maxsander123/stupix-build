name: Build Stupix ISO

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Install dependencies
        run: |
          sudo apt-get update -y

          # Debian Bookworm Keyring direkt per apt installieren (kein fehleranfälliger wget-URL)
          sudo apt-get install -y debian-archive-keyring

          # live-build aus dem Ubuntu-Repository installieren
          # (manuelle .deb-URLs sind instabil und führen zu 404-Fehlern)
          sudo apt-get install -y \
            live-build \
            debootstrap \
            xorriso \
            isolinux \
            syslinux-common \
            squashfs-tools \
            wget curl rsync cpio gzip bzip2 xz-utils gnupg2

          echo "live-build version: $(lb --version)"

          # Prüfen ob Keyring vorhanden
          ls -lh /usr/share/keyrings/debian-archive-keyring.gpg
          echo "Keyring vorhanden ✅"

      - name: ⚙️ Configure live-build
        run: |
          # live-build explizit für Debian Bookworm konfigurieren.
          # Ohne --distribution und weitere Flags baut lb mit Ubuntu-Defaults
          # was auf GitHub-Runnern immer scheitert.
          sudo lb config \
            --distribution bookworm \
            --archive-areas "main contrib non-free non-free-firmware" \
            --apt-source-archives false \
            --binary-images iso-hybrid \
            --bootappend-live "boot=live components locales=de_DE.UTF-8 keyboard-layouts=de" \
            --mirror-bootstrap "http://deb.debian.org/debian/" \
            --mirror-binary "http://deb.debian.org/debian/" \
            --mirror-binary-security "http://security.debian.org/debian-security/" \
            --apt-recommends false \
            --memtest none \
            --win32-loader false \
            --zsync false
          echo "lb config ✅"

      - name: 🏗️ Build ISO
        run: |
          sudo lb build 2>&1 | tee build.log
          echo "=== Suche ISO ==="
          find . -name "*.iso" 2>/dev/null || echo "Keine ISO gefunden"

      - name: 📄 Upload Build Log (immer)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 5
          if-no-files-found: warn

      - name: 📍 Find ISO
        id: find_iso
        run: |
          ISO_PATH=$(find /home/runner/work -name "*.iso" -type f 2>/dev/null | head -1)
          if [ -z "$ISO_PATH" ]; then
            echo "❌ Keine ISO gefunden!"
            ls -lah
            exit 1
          fi
          echo "✅ ISO gefunden: $ISO_PATH"
          ls -lh "$ISO_PATH"
          DEST="${GITHUB_WORKSPACE}/stupix-linux.iso"
          sudo cp "$ISO_PATH" "$DEST"
          sudo chmod 644 "$DEST"
          if [ ! -f "$DEST" ]; then
            echo "❌ Kopieren der ISO fehlgeschlagen!"
            exit 1
          fi
          echo "iso_path=$DEST" >> $GITHUB_OUTPUT
          ls -lh "$DEST"

      - name: 🏷️ Generate Release Tag
        id: tag
        run: |
          TAG="v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Tag: $TAG"

      - name: 🚀 Create GitHub Release
        # Verwende v1 statt v2 – v2 hat Breaking Changes in der API
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Stupix Linux ${{ steps.tag.outputs.tag }}"
          body: |
            ## 🐧 Stupix Linux ISO
            Automatisch gebaut aus Commit `${{ github.sha }}`
            - **Branch:** ${{ github.ref_name }}
            - **Gebaut am:** ${{ github.event.head_commit.timestamp }}
          files: ${{ steps.find_iso.outputs.iso_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
