name: Build Stupix ISO

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Install dependencies
        run: |
          sudo apt-get update -y

          # Install base packages
          sudo apt-get install -y \
            debian-archive-keyring \
            debootstrap \
            xorriso \
            isolinux \
            syslinux-common \
            squashfs-tools \
            wget curl rsync cpio gzip bzip2 xz-utils gnupg2

          # Import Debian Bookworm signing key via ftp-master (keyserver often broken in CI)
          echo "Importing Debian Bookworm signing key..."
          wget -qO- https://ftp-master.debian.org/keys/archive-key-12.asc | \
            sudo gpg --no-default-keyring \
                 --keyring /usr/share/keyrings/debian-archive-keyring.gpg \
                 --import || true

          # Install live-build from Ubuntu (version available)
          sudo apt-get install -y live-build

          echo "live-build version: $(lb --version)"

          # CRITICAL FIX: Patch lb_chroot_linux-image to skip the broken
          # Contents-amd64.gz download. The Ubuntu-packaged live-build tries to
          # fetch https://deb.debian.org/debian/dists/bookworm/Contents-amd64.gz
          # which returns 404. We patch it so it skips this step entirely and
          # relies on the package list (config/package-lists/kernel.list.chroot)
          # to install the kernel package directly.
          LB_LINUX_IMAGE=/usr/lib/live/build/lb_chroot_linux-image
          if [ -f "$LB_LINUX_IMAGE" ]; then
            echo "Patching $LB_LINUX_IMAGE to skip Contents-amd64.gz fetch..."
            # Replace the wget call that fetches Contents-amd64.gz with a no-op
            sudo sed -i \
              's|wget.*Contents-${LB_ARCHITECTURES}.gz.*|echo "Skipping Contents file fetch (patched)"|g' \
              "$LB_LINUX_IMAGE"
            # Also neutralize any pipe into zcat/grep that would fail
            sudo sed -i \
              's|zcat.*Contents.*gz.*grep|true \&\& echo|g' \
              "$LB_LINUX_IMAGE"
            echo "Patch applied. Relevant section of lb_chroot_linux-image:"
            grep -n "Contents\|wget\|zcat" "$LB_LINUX_IMAGE" | head -20 || true
          else
            echo "WARNING: $LB_LINUX_IMAGE not found, listing live-build scripts..."
            find /usr/lib/live -name "*linux*" 2>/dev/null || true
          fi

          echo "Keyring ready ✅"

      - name: ⚙️ Configure live-build
        run: |
          # auto/config contains all configuration parameters.
          # Call lb config WITHOUT extra arguments so auto/config takes over.
          sudo lb config
          echo "lb config ✅"

      - name: 🏗️ Build ISO
        run: |
          # WICHTIG: pipefail aktivieren!
          # Ohne pipefail maskiert `tee` den Exit-Code von `lb build`.
          set -o pipefail
          sudo lb build 2>&1 | tee build.log
          echo "=== Suche ISO ==="
          find . -name "*.iso" 2>/dev/null || echo "Keine ISO gefunden"

      - name: 📄 Upload Build Log (immer)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 5
          if-no-files-found: warn

      - name: 📍 Find ISO
        id: find_iso
        run: |
          # lb build legt die ISO im aktuellen Arbeitsverzeichnis ($GITHUB_WORKSPACE) ab.
          ISO_PATH=$(find "${GITHUB_WORKSPACE}" -maxdepth 2 -name "*.iso" -type f 2>/dev/null | head -1)

          # Fallback: ISO direkt im aktuellen Verzeichnis
          if [ -z "$ISO_PATH" ]; then
            ISO_PATH=$(ls *.iso 2>/dev/null | head -1)
            if [ -n "$ISO_PATH" ]; then
              ISO_PATH="$(pwd)/${ISO_PATH}"
            fi
          fi

          if [ -z "$ISO_PATH" ]; then
            echo "❌ Keine ISO gefunden!"
            echo "=== Verzeichnisinhalt ==="
            ls -lah
            echo "=== Suche nach .iso in gesamt /home/runner ==="
            find /home/runner -name "*.iso" 2>/dev/null || echo "(keine gefunden)"
            exit 1
          fi
          echo "✅ ISO gefunden: $ISO_PATH"
          ls -lh "$ISO_PATH"
          DEST="${GITHUB_WORKSPACE}/stupix-linux.iso"
          sudo cp "$ISO_PATH" "$DEST"
          sudo chmod 644 "$DEST"
          if [ ! -f "$DEST" ]; then
            echo "❌ Kopieren der ISO fehlgeschlagen!"
            exit 1
          fi
          echo "iso_path=$DEST" >> $GITHUB_OUTPUT
          ls -lh "$DEST"

      - name: 🏷️ Generate Release Tag
        id: tag
        run: |
          TAG="v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Tag: $TAG"

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Stupix Linux ${{ steps.tag.outputs.tag }}"
          body: |
            # 🐧 Stupix Linux ISO
            Automatisch gebaut aus Commit `${{ github.sha }}`
            - **Branch:** ${{ github.ref_name }}
            - **Gebaut am:** ${{ github.event.head_commit.timestamp }}
          files: ${{ steps.find_iso.outputs.iso_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
