name: Build Stupix ISO

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Install live-build & dependencies
        run: |
          sudo apt-get update -y

          # Ubuntu live-build KOMPLETT entfernen
          sudo apt-get remove --purge -y live-build 2>/dev/null || true

          # Abhängigkeiten installieren
          sudo apt-get install -y \
            debootstrap \
            xorriso \
            isolinux \
            syslinux-common \
            squashfs-tools \
            wget \
            curl \
            rsync \
            cpio \
            gzip \
            bzip2 \
            xz-utils \
            gnupg2 \
            apt-utils

          # Debian live-build installieren
          wget -q "https://deb.debian.org/debian/pool/main/l/live-build/live-build_20230502_all.deb" -O /tmp/live-build.deb
          sudo dpkg -i /tmp/live-build.deb

          echo "live-build version: $(lb --version)"

      - name: ⚙️ Configure live-build
        run: sudo lb config

      - name: 🏗️ Build ISO
        run: sudo lb build 2>&1 | tee build.log

      - name: 📋 Upload Build Log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 3

      - name: 🏷️ Generate Release Tag
        if: success()
        id: tag
        run: |
          TAG="v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Generated tag: $TAG"

      - name: 🚀 Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Stupix Linux ${{ steps.tag.outputs.tag }}"
          body: |
            ## 🖥️ Stupix Linux ISO

            Automatisch gebautes ISO aus Commit `${{ github.sha }}`.

            ### 📥 Download
            Lade die `.iso` Datei unten herunter und boote sie direkt (USB/VM).

            ### ℹ️ Build-Info
            - **Branch:** `${{ github.ref_name }}`
            - **Commit:** `${{ github.sha }}`
            - **Gebaut am:** `${{ github.event.head_commit.timestamp }}`
          files: "*.iso"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
