name: Build Stupix ISO

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Install live-build & dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            live-build \
            debootstrap \
            xorriso \
            isolinux \
            syslinux-common \
            squashfs-tools \
            wget \
            curl

      - name: ⚙️ Configure live-build
        run: sudo lb config

      - name: 🏗️ Build ISO
        run: sudo lb build

      - name: 📦 Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stupix-iso
          path: "*.iso"
          retention-days: 7
