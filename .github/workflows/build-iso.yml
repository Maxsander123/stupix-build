name: Build Stupix ISO

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Install dependencies
        run: |
          sudo apt-get update -y

          # Install base packages
          sudo apt-get install -y \
            debian-archive-keyring \
            debootstrap \
            xorriso \
            isolinux \
            syslinux-common \
            squashfs-tools \
            wget curl rsync cpio gzip bzip2 xz-utils gnupg2

          # The Ubuntu-packaged debian-archive-keyring is outdated and missing
          # the Debian Bookworm signing key F8D2585B8783D481.
          # Fetch it directly from the Debian keyserver and add it to the keyring.
          echo "Importing Debian Bookworm signing key F8D2585B8783D481..."
          sudo gpg --no-default-keyring \
               --keyring /usr/share/keyrings/debian-archive-keyring.gpg \
               --keyserver hkps://keyserver.ubuntu.com \
               --recv-keys F8D2585B8783D481 || true

          # Fallback: fetch from ftp-master.debian.org
          if ! sudo gpg --no-default-keyring \
               --keyring /usr/share/keyrings/debian-archive-keyring.gpg \
               --list-keys F8D2585B8783D481 > /dev/null 2>&1; then
            echo "Keyserver failed, trying ftp-master.debian.org..."
            wget -qO- https://ftp-master.debian.org/keys/archive-key-12.asc | \
              sudo gpg --no-default-keyring \
                   --keyring /usr/share/keyrings/debian-archive-keyring.gpg \
                   --import
          fi

          # Install live-build from the Debian Bookworm repository
          # (the Ubuntu-packaged version has a bug: it tries to fetch
          #  Contents-amd64.gz which returns 404 on Debian mirrors)
          echo "Adding Debian Bookworm repo to install live-build..."
          echo "deb [signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] https://deb.debian.org/debian bookworm main" \
            | sudo tee /etc/apt/sources.list.d/debian-bookworm.list

          # Pin so only live-build (and its deps) come from Debian
          cat <<'EOF' | sudo tee /etc/apt/preferences.d/debian-bookworm
Package: *
Pin: release o=Debian,n=bookworm
Pin-Priority: 100

Package: live-build
Pin: release o=Debian,n=bookworm
Pin-Priority: 900
EOF

          sudo apt-get update -y
          sudo apt-get install -y -t bookworm live-build

          echo "live-build version: $(lb --version)"

          # Verify keyring contains the required key
          echo "=== Keyring keys ==="
          sudo gpg --no-default-keyring \
               --keyring /usr/share/keyrings/debian-archive-keyring.gpg \
               --list-keys 2>/dev/null | grep -E "^pub|F8D2585B8783D481" || true
          echo "Keyring ready ✅"

      - name: ⚙️ Configure live-build
        run: |
          # auto/config contains all configuration parameters.
          # Call lb config WITHOUT extra arguments so auto/config takes over.
          sudo lb config
          echo "lb config ✅"

      - name: 🏗️ Build ISO
        run: |
          # WICHTIG: pipefail aktivieren!
          # Ohne pipefail maskiert `tee` den Exit-Code von `lb build`.
          set -o pipefail
          sudo lb build 2>&1 | tee build.log
          echo "=== Suche ISO ==="
          find . -name "*.iso" 2>/dev/null || echo "Keine ISO gefunden"

      - name: 📄 Upload Build Log (immer)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 5
          if-no-files-found: warn

      - name: 📍 Find ISO
        id: find_iso
        run: |
          # lb build legt die ISO im aktuellen Arbeitsverzeichnis ($GITHUB_WORKSPACE) ab.
          ISO_PATH=$(find "${GITHUB_WORKSPACE}" -maxdepth 2 -name "*.iso" -type f 2>/dev/null | head -1)

          # Fallback: ISO direkt im aktuellen Verzeichnis
          if [ -z "$ISO_PATH" ]; then
            ISO_PATH=$(ls *.iso 2>/dev/null | head -1)
            if [ -n "$ISO_PATH" ]; then
              ISO_PATH="$(pwd)/${ISO_PATH}"
            fi
          fi

          if [ -z "$ISO_PATH" ]; then
            echo "❌ Keine ISO gefunden!"
            echo "=== Verzeichnisinhalt ==="
            ls -lah
            echo "=== Suche nach .iso in gesamt /home/runner ==="
            find /home/runner -name "*.iso" 2>/dev/null || echo "(keine gefunden)"
            exit 1
          fi
          echo "✅ ISO gefunden: $ISO_PATH"
          ls -lh "$ISO_PATH"
          DEST="${GITHUB_WORKSPACE}/stupix-linux.iso"
          sudo cp "$ISO_PATH" "$DEST"
          sudo chmod 644 "$DEST"
          if [ ! -f "$DEST" ]; then
            echo "❌ Kopieren der ISO fehlgeschlagen!"
            exit 1
          fi
          echo "iso_path=$DEST" >> $GITHUB_OUTPUT
          ls -lh "$DEST"

      - name: 🏷️ Generate Release Tag
        id: tag
        run: |
          TAG="v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Tag: $TAG"

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Stupix Linux ${{ steps.tag.outputs.tag }}"
          body: |
            # 🐧 Stupix Linux ISO
            Automatisch gebaut aus Commit `${{ github.sha }}`
            - **Branch:** ${{ github.ref_name }}
            - **Gebaut am:** ${{ github.event.head_commit.timestamp }}
          files: ${{ steps.find_iso.outputs.iso_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
