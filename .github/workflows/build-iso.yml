name: Build Stupix ISO

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── amd64: build + UEFI boot test + BIOS boot test ──────────────────────
  build-amd64:
    runs-on: ubuntu-22.04
    container:
      image: debian:bookworm
      options: --privileged

    env:
      DEBIAN_FRONTEND: noninteractive
      STUPIX_ARCH: amd64

    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Install build dependencies
        run: |
          apt-get update -y
          apt-get install -y --no-install-recommends \
            live-build debootstrap xorriso squashfs-tools \
            grub-efi-amd64 grub-efi-amd64-bin grub-efi-amd64-signed shim-signed \
            syslinux syslinux-common isolinux syslinux-utils \
            debian-archive-keyring \
            wget curl git gnupg2 ca-certificates sudo
          echo "live-build: $(lb --version)"

      - name: ⚙️ Configure
        run: lb config

      - name: 🏗️ Build ISO
        shell: bash
        run: |
          lb build 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          find . -name "*.iso" 2>/dev/null || echo "No ISO found"
          exit ${EXIT_CODE}

      - name: 📄 Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-amd64
          path: build.log
          retention-days: 5
          if-no-files-found: warn

      - name: 📍 Find ISO
        id: find_iso
        shell: bash
        run: |
          ISO=$(find . -maxdepth 2 -name "*.iso" -type f | head -1)
          [ -z "$ISO" ] && { echo "❌ No ISO found"; ls -lah; exit 1; }
          echo "✅ ISO: $ISO  ($(ls -lh "$ISO" | awk '{print $5}'))"
          cp "$ISO" "$(pwd)/stupix-linux-amd64.iso"
          echo "iso_path=$(pwd)/stupix-linux-amd64.iso" >> $GITHUB_OUTPUT

      # ── Test 1: amd64 UEFI (OVMF) ────────────────────────────────────────
      - name: 🔍 Boot Test — amd64 UEFI
        shell: bash
        run: |
          set -e
          ISO="${{ steps.find_iso.outputs.iso_path }}"
          BOOT_LOG="$(pwd)/boot-uefi.log"

          apt-get install -y --no-install-recommends qemu-system-x86 ovmf mtools 2>&1 | tail -3

          OVMF=$(find /usr/share/ovmf /usr/share/OVMF -name "OVMF.fd" 2>/dev/null | head -1)
          echo "OVMF: $OVMF"

          if [ -e /dev/kvm ]; then KVM="-enable-kvm"; TIMEOUT=120; echo "KVM: yes"
          else KVM=""; TIMEOUT=300; echo "KVM: no (software)"; fi

          # Extract ISO, patch grub.cfg for serial console + instant boot
          mkdir -p /tmp/iso-mount /tmp/iso-uefi
          mount -o loop,ro "$ISO" /tmp/iso-mount
          cp -a /tmp/iso-mount/. /tmp/iso-uefi/
          chmod -R u+w /tmp/iso-uefi
          umount /tmp/iso-mount

          VMLINUZ=$(basename "$(find /tmp/iso-uefi/live -name "vmlinuz*" | head -1)")
          INITRD=$(basename "$(find /tmp/iso-uefi/live -name "initrd*" | head -1)")
          echo "Kernel: $VMLINUZ  Initrd: $INITRD"

          cat > /tmp/iso-uefi/boot/grub/grub.cfg << GRUBCFG
          set timeout=0
          set default=0
          menuentry "Stupix UEFI Test" {
              linux  /live/${VMLINUZ} boot=live components net.ifnames=0 biosdevname=0 console=ttyS0,115200n8 systemd.journald.forward_to_console=yes
              initrd /live/${INITRD}
          }
          GRUBCFG

          xorriso -as mkisofs \
            -iso-level 3 -volid "Stupix Live" -full-iso9660-filenames \
            -eltorito-alt-boot -e boot/grub/efi.img -no-emul-boot \
            -isohybrid-gpt-basdat \
            -o /tmp/stupix-uefi-test.iso /tmp/iso-uefi 2>&1 | tail -3

          echo "Booting (UEFI, timeout: ${TIMEOUT}s)..."
          timeout "${TIMEOUT}" qemu-system-x86_64 \
            $KVM -m 2048 -smp 2 \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF" \
            -cdrom /tmp/stupix-uefi-test.iso -boot d \
            -nographic -serial mon:stdio \
            -net nic -net user \
            2>&1 | tee "$BOOT_LOG" || true

          tail -20 "$BOOT_LOG"
          FAIL=0
          grep -q "squashfs: version" "$BOOT_LOG"     && echo "✅ squashfs" || { echo "❌ squashfs"; FAIL=1; }
          grep -qE "network-online|Reached target.*network" "$BOOT_LOG" && echo "✅ network" || { echo "❌ network"; FAIL=1; }
          grep -q "stupix-init" "$BOOT_LOG"            && echo "✅ stupix-init" || { echo "❌ stupix-init"; FAIL=1; }
          [ "$FAIL" -eq 1 ] && { echo "❌ amd64 UEFI boot test FAILED"; exit 1; }
          echo "✅ amd64 UEFI boot test passed"

      # ── Test 2: amd64 BIOS (SeaBIOS via isolinux) ────────────────────────
      - name: 🔍 Boot Test — amd64 BIOS
        shell: bash
        run: |
          set -e
          ISO="${{ steps.find_iso.outputs.iso_path }}"
          BOOT_LOG="$(pwd)/boot-bios.log"

          if [ -e /dev/kvm ]; then KVM="-enable-kvm"; TIMEOUT=120; echo "KVM: yes"
          else KVM=""; TIMEOUT=300; echo "KVM: no (software)"; fi

          # Extract ISO, patch isolinux configs for serial console + instant boot
          mkdir -p /tmp/iso-mount-bios /tmp/iso-bios
          mount -o loop,ro "$ISO" /tmp/iso-mount-bios
          cp -a /tmp/iso-mount-bios/. /tmp/iso-bios/
          chmod -R u+w /tmp/iso-bios
          umount /tmp/iso-mount-bios

          echo "=== isolinux config files ==="
          find /tmp/iso-bios/isolinux -name "*.cfg" | head -20 || echo "no isolinux dir"
          find /tmp/iso-bios/isolinux -name "*.cfg" -exec cat {} \; 2>/dev/null | head -40 || true

          # Patch all isolinux .cfg files: timeout=0, add serial console, remove quiet/splash
          for cfg in /tmp/iso-bios/isolinux/*.cfg; do
            [ -f "$cfg" ] || continue
            # Set timeout to 0 (isolinux units: 1/10s, so 0 = no wait)
            sed -i 's/^TIMEOUT.*/TIMEOUT 0/I' "$cfg"
            sed -i 's/^timeout.*/timeout 0/' "$cfg"
            # Remove quiet and splash from append lines
            sed -i 's/ quiet\b//g; s/ splash\b//g' "$cfg"
            # Add serial console to append lines (avoid duplicates)
            grep -q "console=ttyS0" "$cfg" || \
              sed -i '/^[[:space:]]*append /s/$/ console=ttyS0,115200n8 systemd.journald.forward_to_console=yes/' "$cfg"
          done

          echo "=== patched isolinux configs ==="
          find /tmp/iso-bios/isolinux -name "*.cfg" -exec cat {} \; 2>/dev/null | head -40 || true

          # Find isohdpfx.bin for hybrid MBR
          ISOHDPFX=$(find /usr/lib/ISOLINUX /usr/share/syslinux -name "isohdpfx.bin" 2>/dev/null | head -1)
          echo "isohdpfx.bin: $ISOHDPFX"

          # Repack ISO with BIOS El Torito boot record
          XORRISO_ARGS="-iso-level 3 -volid Stupix_Live -full-iso9660-filenames"
          XORRISO_ARGS="$XORRISO_ARGS -b isolinux/isolinux.bin -c isolinux/boot.cat"
          XORRISO_ARGS="$XORRISO_ARGS -no-emul-boot -boot-load-size 4 -boot-info-table"
          [ -n "$ISOHDPFX" ] && XORRISO_ARGS="$XORRISO_ARGS -isohybrid-mbr $ISOHDPFX"

          xorriso -as mkisofs $XORRISO_ARGS \
            -o /tmp/stupix-bios-test.iso /tmp/iso-bios 2>&1 | tail -5

          echo "Booting (BIOS/SeaBIOS, timeout: ${TIMEOUT}s)..."
          timeout "${TIMEOUT}" qemu-system-x86_64 \
            $KVM -m 2048 -smp 2 \
            -cdrom /tmp/stupix-bios-test.iso -boot d \
            -nographic -serial mon:stdio \
            -net nic -net user \
            2>&1 | tee "$BOOT_LOG" || true

          tail -20 "$BOOT_LOG"
          FAIL=0
          grep -q "squashfs: version" "$BOOT_LOG"     && echo "✅ squashfs" || { echo "❌ squashfs"; FAIL=1; }
          grep -qE "network-online|Reached target.*network" "$BOOT_LOG" && echo "✅ network" || { echo "❌ network"; FAIL=1; }
          grep -q "stupix-init" "$BOOT_LOG"            && echo "✅ stupix-init" || { echo "❌ stupix-init"; FAIL=1; }
          [ "$FAIL" -eq 1 ] && { echo "❌ amd64 BIOS boot test FAILED"; exit 1; }
          echo "✅ amd64 BIOS boot test passed"

      - name: 📄 Upload Boot Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-logs-amd64
          path: |
            boot-uefi.log
            boot-bios.log
          retention-days: 5
          if-no-files-found: warn

      - name: 📦 Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: stupix-linux-amd64
          path: stupix-linux-amd64.iso
          retention-days: 7

      - name: 🏷️ Generate Release Tag
        id: tag
        shell: bash
        run: |
          TAG="v$(date +'%Y.%m.%d')-${GITHUB_SHA:0:7}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Tag: $TAG"

  # ── arm64: cross-build on amd64 via qemu-user-static ────────────────────
  # Using ubuntu-22.04 (amd64) + qemu-user-static is the documented approach
  # for arm64 live-build ISOs. Running natively on ubuntu-24.04-arm causes
  # live-build to install amd64-specific packages (grub-efi-amd64-signed,
  # linux-image-amd64) in the arm64 chroot — a live-build bug for native ARM.
  build-arm64:
    runs-on: ubuntu-22.04
    container:
      image: debian:bookworm
      options: --privileged

    env:
      DEBIAN_FRONTEND: noninteractive
      STUPIX_ARCH: arm64

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Install build dependencies
        run: |
          apt-get update -y
          apt-get install -y --no-install-recommends \
            live-build debootstrap xorriso squashfs-tools \
            qemu-user-static binfmt-support \
            grub-efi-arm64-bin \
            debian-archive-keyring \
            wget curl git gnupg2 ca-certificates sudo
          update-binfmts --enable qemu-aarch64 2>/dev/null || true
          echo "live-build: $(lb --version)"
          echo "qemu-aarch64-static: $(qemu-aarch64-static --version 2>&1 | head -1)"

      - name: ⚙️ Configure
        run: lb config

      - name: 🏗️ Build ISO
        shell: bash
        run: |
          lb build 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          find . -name "*.iso" 2>/dev/null || echo "No ISO found"
          exit ${EXIT_CODE}

      - name: 📄 Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-arm64
          path: build.log
          retention-days: 5
          if-no-files-found: warn

      - name: 📍 Find ISO
        id: find_iso
        shell: bash
        run: |
          ISO=$(find . -maxdepth 2 -name "*.iso" -type f | head -1)
          [ -z "$ISO" ] && { echo "❌ No ISO found"; ls -lah; exit 1; }
          echo "✅ ISO: $ISO  ($(ls -lh "$ISO" | awk '{print $5}'))"
          cp "$ISO" "$(pwd)/stupix-linux-arm64.iso"
          echo "iso_path=$(pwd)/stupix-linux-arm64.iso" >> $GITHUB_OUTPUT

      # ── Test 3: arm64 UEFI (qemu-system-aarch64 on amd64 host) ─────────
      - name: 🔍 Boot Test — arm64 UEFI
        shell: bash
        run: |
          set -e
          ISO="${{ steps.find_iso.outputs.iso_path }}"
          BOOT_LOG="$(pwd)/boot-arm64-uefi.log"

          apt-get install -y --no-install-recommends \
            qemu-system-arm qemu-efi-aarch64 mtools 2>&1 | tail -3

          AAVMF=$(find /usr/share -name "QEMU_EFI.fd" -o -name "AAVMF.fd" 2>/dev/null | head -1)
          echo "ARM UEFI firmware: $AAVMF"

          # No KVM on amd64 host for arm64 — software emulation, longer timeout
          TIMEOUT=600
          echo "Software emulation (amd64 host → arm64 guest), timeout: ${TIMEOUT}s"

          # Extract ISO, patch grub.cfg for serial console
          # ARM64 QEMU virt uses ttyAMA0 (PL011 UART), not ttyS0
          mkdir -p /tmp/iso-mount-arm64 /tmp/iso-arm64
          mount -o loop,ro "$ISO" /tmp/iso-mount-arm64
          cp -a /tmp/iso-mount-arm64/. /tmp/iso-arm64/
          chmod -R u+w /tmp/iso-arm64
          umount /tmp/iso-mount-arm64

          VMLINUZ=$(basename "$(find /tmp/iso-arm64/live -name "vmlinuz*" | head -1)")
          INITRD=$(basename "$(find /tmp/iso-arm64/live -name "initrd*" | head -1)")
          echo "Kernel: $VMLINUZ  Initrd: $INITRD"

          cat > /tmp/iso-arm64/boot/grub/grub.cfg << GRUBCFG
          set timeout=0
          set default=0
          menuentry "Stupix ARM64 UEFI Test" {
              linux  /live/${VMLINUZ} boot=live components net.ifnames=0 biosdevname=0 console=ttyAMA0,115200n8 systemd.journald.forward_to_console=yes
              initrd /live/${INITRD}
          }
          GRUBCFG

          xorriso -as mkisofs \
            -iso-level 3 -volid "Stupix Live" -full-iso9660-filenames \
            -eltorito-alt-boot -e boot/grub/efi.img -no-emul-boot \
            -o /tmp/stupix-arm64-test.iso /tmp/iso-arm64 2>&1 | tail -3

          echo "Booting (arm64 UEFI, timeout: ${TIMEOUT}s)..."
          timeout "${TIMEOUT}" qemu-system-aarch64 \
            -machine virt,gic-version=3 \
            -cpu cortex-a57 -smp 4 \
            -m 4096 \
            -drive if=pflash,format=raw,readonly=on,file="$AAVMF" \
            -cdrom /tmp/stupix-arm64-test.iso -boot d \
            -nographic -serial mon:stdio \
            -net nic -net user \
            2>&1 | tee "$BOOT_LOG" || true

          tail -20 "$BOOT_LOG"
          FAIL=0
          grep -q "squashfs: version" "$BOOT_LOG"     && echo "✅ squashfs" || { echo "❌ squashfs"; FAIL=1; }
          grep -qE "network-online|Reached target.*network" "$BOOT_LOG" && echo "✅ network" || { echo "❌ network"; FAIL=1; }
          grep -q "stupix-init" "$BOOT_LOG"            && echo "✅ stupix-init" || { echo "❌ stupix-init"; FAIL=1; }
          [ "$FAIL" -eq 1 ] && { echo "❌ arm64 UEFI boot test FAILED"; exit 1; }
          echo "✅ arm64 UEFI boot test passed"

      - name: 📄 Upload Boot Test Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-log-arm64
          path: boot-arm64-uefi.log
          retention-days: 5
          if-no-files-found: warn

      - name: 📦 Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: stupix-linux-arm64
          path: stupix-linux-arm64.iso
          retention-days: 7

  # ── Release: alle 3 Tests müssen bestehen ────────────────────────────────
  release:
    needs: [build-amd64, build-arm64]
    # Kein always() — beide Jobs müssen success sein
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Download amd64 ISO
        uses: actions/download-artifact@v4
        with:
          name: stupix-linux-amd64
          path: release/

      - name: 📥 Download arm64 ISO
        uses: actions/download-artifact@v4
        with:
          name: stupix-linux-arm64
          path: release/

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.build-amd64.outputs.tag }}
          name: "Stupix Linux ${{ needs.build-amd64.outputs.tag }}"
          body: |
            # Stupix Linux ISO

            Automatically built and boot-tested from commit `${{ github.sha }}`

            **All three boot tests passed before this release was published:**
            - ✅ amd64 BIOS (SeaBIOS / isolinux)
            - ✅ amd64 UEFI (OVMF / grub-efi)
            - ✅ arm64 UEFI (QEMU_EFI / grub-efi)

            ## Downloads

            | File | Architecture | Boot modes |
            |---|---|---|
            | `stupix-linux-amd64.iso` | x86-64 (PC, server) | Legacy BIOS + UEFI |
            | `stupix-linux-arm64.iso` | ARM64 (RPi, ARM server) | UEFI |

            ## Flash to USB

            ```bash
            # Linux (replace sdX — use lsblk to find your USB drive)
            sudo dd if=stupix-linux-amd64.iso of=/dev/sdX bs=4M status=progress && sync

            # macOS
            sudo dd if=stupix-linux-amd64.iso of=/dev/rdiskX bs=4m && sync
            ```

            SSH after ~30 s: `ssh root@<ip>` · Password: `stupix`
          files: release/*.iso
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
