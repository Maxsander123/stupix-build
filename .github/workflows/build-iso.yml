name: Build Stupix ISO

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: 📥 Repository auschecken
        uses: actions/checkout@v4

      - name: 🔧 System vorbereiten & live-build installieren
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-common \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            curl \
            wget \
            git

      - name: 🛠️ auto/config ausführbar machen
        run: |
          chmod +x auto/config
          if [ -f auto/clean ]; then chmod +x auto/clean; fi
          if [ -f auto/build ]; then chmod +x auto/build; fi

      - name: ⚙️ live-build konfigurieren
        run: |
          sudo lb config

      - name: 🏗️ ISO bauen
        run: |
          sudo lb build
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: 🔍 ISO-Datei finden
        run: |
          ls -lah *.iso 2>/dev/null || echo "Keine ISO im Root"
          find . -name "*.iso" -not -path "./.git/*" | head -20

      - name: 📦 ISO als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: stupix-iso
          path: "*.iso"
          retention-days: 7
          if-no-files-found: warn
