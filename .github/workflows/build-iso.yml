name: Build Stupix ISO

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install live-build and dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get remove --purge -y live-build 2>/dev/null || true
          sudo apt-get install -y \
            debian-archive-keyring \
            debootstrap \
            xorriso \
            isolinux \
            syslinux-common \
            squashfs-tools \
            wget curl rsync cpio gzip bzip2 xz-utils gnupg2 apt-utils
          wget -q "https://deb.debian.org/debian/pool/main/l/live-build/live-build_20230502_all.deb" -O /tmp/live-build.deb
          sudo dpkg -i /tmp/live-build.deb
          echo "live-build version: $(lb --version)"
          sudo mkdir -p /usr/share/keyrings
          sudo cp /usr/share/keyrings/debian-archive-keyring.gpg /usr/share/keyrings/ 2>/dev/null || true

      - name: Configure live-build
        run: sudo lb config

      - name: Build ISO
        run: |
          sudo lb build 2>&1 | tee build.log
          echo "=== Suche ISO ==="
          find . -name "*.iso" 2>/dev/null || echo "Keine ISO gefunden"

      - name: Find ISO and prepare release
        id: find_iso
        run: |
          ISO_PATH=$(find /home/runner/work -name "*.iso" -type f 2>/dev/null | head -1)
          if [ -z "$ISO_PATH" ]; then
            ISO_PATH=$(find . -name "*.iso" -type f 2>/dev/null | head -1)
          fi
          if [ -z "$ISO_PATH" ]; then
            echo "Keine ISO gefunden"
            ls -lah
            exit 1
          fi
          echo "ISO gefunden: $ISO_PATH"
          DEST="${GITHUB_WORKSPACE}/stupix-linux.iso"
          sudo cp "$ISO_PATH" "$DEST"
          echo "iso_path=$DEST" >> $GITHUB_OUTPUT
          ls -lh "$DEST"

      - name: Upload Build Log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 3

      - name: Generate Release Tag
        if: success()
        id: tag
        run: |
          TAG="v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Tag: $TAG"

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Stupix Linux ${{ steps.tag.outputs.tag }}"
          body: |
            ## Stupix Linux ISO
            Automatisch gebaut aus Commit `${{ github.sha }}`
            - Branch: ${{ github.ref_name }}
            - Gebaut am: ${{ github.event.head_commit.timestamp }}
          files: ${{ steps.find_iso.outputs.iso_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
