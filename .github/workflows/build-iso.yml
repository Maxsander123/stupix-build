name: Build Stupix ISO

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: debian:bookworm
    timeout-minutes: 90

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: 📥 Install git for checkout
        run: |
          apt-get update -y
          apt-get install -y --no-install-recommends git ca-certificates

      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Install dependencies
        run: |
          apt-get update -y

          # Install live-build and all required tools natively on Debian Bookworm
          apt-get install -y --no-install-recommends \
            live-build \
            debian-archive-keyring \
            debootstrap \
            xorriso \
            isolinux \
            syslinux-common \
            squashfs-tools \
            wget curl rsync cpio gzip bzip2 xz-utils gnupg2 \
            sudo

          echo "live-build version: $(lb --version)"

      - name: ⚙️ Configure live-build
        run: |
          # auto/config contains all configuration parameters.
          # Call lb config WITHOUT extra arguments so auto/config takes over.
          lb config
          echo "lb config ✅"

      - name: 🏗️ Build ISO
        run: |
          # WICHTIG: pipefail aktivieren!
          # Ohne pipefail maskiert `tee` den Exit-Code von `lb build`.
          set -o pipefail
          lb build 2>&1 | tee build.log
          echo "=== Suche ISO ==="
          find . -name "*.iso" 2>/dev/null || echo "Keine ISO gefunden"

      - name: 📄 Upload Build Log (immer)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 5
          if-no-files-found: warn

      - name: 📍 Find ISO
        id: find_iso
        run: |
          # lb build legt die ISO im aktuellen Arbeitsverzeichnis ($GITHUB_WORKSPACE) ab.
          ISO_PATH=$(find "${GITHUB_WORKSPACE}" -maxdepth 2 -name "*.iso" -type f 2>/dev/null | head -1)

          # Fallback: ISO direkt im aktuellen Verzeichnis
          if [ -z "$ISO_PATH" ]; then
            ISO_PATH=$(ls *.iso 2>/dev/null | head -1)
            if [ -n "$ISO_PATH" ]; then
              ISO_PATH="$(pwd)/${ISO_PATH}"
            fi
          fi

          if [ -z "$ISO_PATH" ]; then
            echo "❌ Keine ISO gefunden!"
            echo "=== Verzeichnisinhalt ==="
            ls -lah
            echo "=== Suche nach .iso in gesamt /root ==="
            find /root -name "*.iso" 2>/dev/null || echo "(keine gefunden)"
            exit 1
          fi
          echo "✅ ISO gefunden: $ISO_PATH"
          ls -lh "$ISO_PATH"
          DEST="${GITHUB_WORKSPACE}/stupix-linux.iso"
          cp "$ISO_PATH" "$DEST"
          chmod 644 "$DEST"
          if [ ! -f "$DEST" ]; then
            echo "❌ Kopieren der ISO fehlgeschlagen!"
            exit 1
          fi
          echo "iso_path=$DEST" >> $GITHUB_OUTPUT
          ls -lh "$DEST"

      - name: 🏷️ Generate Release Tag
        id: tag
        run: |
          TAG="v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Tag: $TAG"

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Stupix Linux ${{ steps.tag.outputs.tag }}"
          body: |
            # 📦 Stupix Linux ISO
            Automatisch gebaut aus Commit `${{ github.sha }}`
            - **Branch:** ${{ github.ref_name }}
            - **Gebaut am:** ${{ github.event.head_commit.timestamp }}
          files: ${{ steps.find_iso.outputs.iso_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
