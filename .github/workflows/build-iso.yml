name: Build Stupix ISO

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Install dependencies
        run: |
          sudo apt-get update -y

          # Install base packages from Ubuntu
          sudo apt-get install -y \
            debian-archive-keyring \
            debootstrap \
            xorriso \
            isolinux \
            syslinux-common \
            squashfs-tools \
            wget curl rsync cpio gzip bzip2 xz-utils gnupg2

          # Import Debian Bookworm signing key into the system keyring
          echo "Importing Debian Bookworm signing key..."
          sudo mkdir -p /usr/share/keyrings
          wget -qO- https://ftp-master.debian.org/keys/archive-key-12.asc | \
            sudo gpg --no-default-keyring \
                 --keyring /usr/share/keyrings/debian-archive-keyring.gpg \
                 --import || true
          wget -qO- https://ftp-master.debian.org/keys/archive-key-12-security.asc | \
            sudo gpg --no-default-keyring \
                 --keyring /usr/share/keyrings/debian-archive-keyring.gpg \
                 --import || true

          # Add Debian Bookworm repository
          echo "deb [signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] https://deb.debian.org/debian bookworm main" \
            | sudo tee /etc/apt/sources.list.d/debian-bookworm.list

          # Pin configuration:
          # - ALL Debian packages get priority -1 (never install/upgrade from Debian)
          # - ONLY live-build gets priority 990 (prefer Debian version over Ubuntu)
          # This prevents Debian's libc6/glibc/libgnutls etc. from overwriting Ubuntu's versions.
          sudo tee /etc/apt/preferences.d/debian-bookworm > /dev/null << 'EOF'
Package: *
Pin: release o=Debian,n=bookworm
Pin-Priority: -1

Package: live-build
Pin: release o=Debian,n=bookworm
Pin-Priority: 990
EOF

          sudo apt-get update -y

          # Install live-build from Debian Bookworm with --no-install-recommends
          # to avoid pulling in Debian system libraries that conflict with Ubuntu
          sudo apt-get install -y --no-install-recommends -t bookworm live-build

          echo "live-build version: $(lb --version)"

          # Verify keyring
          echo "=== Keyring keys ==="
          sudo gpg --no-default-keyring \
               --keyring /usr/share/keyrings/debian-archive-keyring.gpg \
               --list-keys 2>/dev/null | grep -E "^pub|F8D2585B8783D481" || true
          echo "Setup complete ✅"

      - name: ⚙️ Configure live-build
        run: |
          # auto/config contains all configuration parameters.
          # Call lb config WITHOUT extra arguments so auto/config takes over.
          sudo lb config
          echo "lb config ✅"

      - name: 🏗️ Build ISO
        run: |
          # WICHTIG: pipefail aktivieren!
          # Ohne pipefail maskiert `tee` den Exit-Code von `lb build`.
          set -o pipefail
          sudo lb build 2>&1 | tee build.log
          echo "=== Suche ISO ==="
          find . -name "*.iso" 2>/dev/null || echo "Keine ISO gefunden"

      - name: 📄 Upload Build Log (immer)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 5
          if-no-files-found: warn

      - name: 📍 Find ISO
        id: find_iso
        run: |
          # lb build legt die ISO im aktuellen Arbeitsverzeichnis ($GITHUB_WORKSPACE) ab.
          ISO_PATH=$(find "${GITHUB_WORKSPACE}" -maxdepth 2 -name "*.iso" -type f 2>/dev/null | head -1)

          # Fallback: ISO direkt im aktuellen Verzeichnis
          if [ -z "$ISO_PATH" ]; then
            ISO_PATH=$(ls *.iso 2>/dev/null | head -1)
            if [ -n "$ISO_PATH" ]; then
              ISO_PATH="$(pwd)/${ISO_PATH}"
            fi
          fi

          if [ -z "$ISO_PATH" ]; then
            echo "❌ Keine ISO gefunden!"
            echo "=== Verzeichnisinhalt ==="
            ls -lah
            echo "=== Suche nach .iso in gesamt /home/runner ==="
            find /home/runner -name "*.iso" 2>/dev/null || echo "(keine gefunden)"
            exit 1
          fi
          echo "✅ ISO gefunden: $ISO_PATH"
          ls -lh "$ISO_PATH"
          DEST="${GITHUB_WORKSPACE}/stupix-linux.iso"
          sudo cp "$ISO_PATH" "$DEST"
          sudo chmod 644 "$DEST"
          if [ ! -f "$DEST" ]; then
            echo "❌ Kopieren der ISO fehlgeschlagen!"
            exit 1
          fi
          echo "iso_path=$DEST" >> $GITHUB_OUTPUT
          ls -lh "$DEST"

      - name: 🏷️ Generate Release Tag
        id: tag
        run: |
          TAG="v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Tag: $TAG"

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Stupix Linux ${{ steps.tag.outputs.tag }}"
          body: |
            # 📦 Stupix Linux ISO
            Automatisch gebaut aus Commit `${{ github.sha }}`
            - **Branch:** ${{ github.ref_name }}
            - **Gebaut am:** ${{ github.event.head_commit.timestamp }}
          files: ${{ steps.find_iso.outputs.iso_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
