name: Build Stupix ISO

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── amd64: build + BIOS / UEFI / Secure Boot boot tests ──────────────────────
  build-amd64:
    runs-on: ubuntu-22.04
    container:
      image: debian:bookworm
      options: --privileged

    env:
      DEBIAN_FRONTEND: noninteractive
      STUPIX_ARCH: amd64

    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Install build dependencies
        run: |
          apt-get update -y
          apt-get install -y --no-install-recommends \
            live-build debootstrap xorriso squashfs-tools \
            grub-efi-amd64 grub-efi-amd64-bin grub-efi-amd64-signed shim-signed \
            syslinux syslinux-common isolinux syslinux-utils \
            debian-archive-keyring \
            wget curl git gnupg2 ca-certificates sudo
          echo "live-build: $(lb --version)"

      - name: ⚙️ Configure
        run: lb config

      - name: 🏗️ Build ISO
        shell: bash
        run: |
          lb build 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          find . -name "*.iso" 2>/dev/null || echo "No ISO found"
          exit ${EXIT_CODE}

      - name: 📄 Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-amd64
          path: build.log
          retention-days: 5
          if-no-files-found: warn

      - name: 📍 Find ISO
        id: find_iso
        shell: bash
        run: |
          ISO=$(find . -maxdepth 2 -name "*.iso" -type f | head -1)
          [ -z "$ISO" ] && { echo "❌ No ISO found"; ls -lah; exit 1; }
          echo "✅ ISO: $ISO  ($(ls -lh "$ISO" | awk '{print $5}'))"
          cp "$ISO" "$(pwd)/stupix-linux-amd64.iso"
          echo "iso_path=$(pwd)/stupix-linux-amd64.iso" >> $GITHUB_OUTPUT

      # ── Boot tests: the unmodified ISO, as CD and as USB stick ──────────
      - name: 🔧 Install QEMU + OVMF
        run: apt-get install -y --no-install-recommends qemu-system-x86 ovmf

      - name: 🔍 Boot Test — amd64 BIOS (CD)
        run: bash ci/boot-test.sh "${{ steps.find_iso.outputs.iso_path }}" bios-cd

      - name: 🔍 Boot Test — amd64 BIOS (USB)
        run: bash ci/boot-test.sh "${{ steps.find_iso.outputs.iso_path }}" bios-usb

      - name: 🔍 Boot Test — amd64 UEFI (CD)
        run: bash ci/boot-test.sh "${{ steps.find_iso.outputs.iso_path }}" uefi-cd

      - name: 🔍 Boot Test — amd64 UEFI (USB)
        run: bash ci/boot-test.sh "${{ steps.find_iso.outputs.iso_path }}" uefi-usb

      - name: 🔍 Boot Test — amd64 UEFI Secure Boot (CD)
        run: bash ci/boot-test.sh "${{ steps.find_iso.outputs.iso_path }}" uefi-sb-cd

      - name: 📄 Upload Boot Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-logs-amd64
          path: boot-*.log
          retention-days: 5
          if-no-files-found: warn

      - name: 📦 Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: stupix-linux-amd64
          path: stupix-linux-amd64.iso
          retention-days: 7

      - name: 🏷️ Generate Release Tag
        id: tag
        shell: bash
        run: |
          TAG="v$(date +'%Y.%m.%d')-${GITHUB_SHA:0:7}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Tag: $TAG"

  # ── arm64: cross-build on amd64 via qemu-user-static ────────────────────
  # Using ubuntu-22.04 (amd64) + qemu-user-static is the documented approach
  # for arm64 live-build ISOs. Running natively on ubuntu-24.04-arm causes
  # live-build to install amd64-specific packages (grub-efi-amd64-signed,
  # linux-image-amd64) in the arm64 chroot — a live-build bug for native ARM.
  build-arm64:
    runs-on: ubuntu-22.04
    container:
      image: debian:bookworm
      options: --privileged

    env:
      DEBIAN_FRONTEND: noninteractive
      STUPIX_ARCH: arm64

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Install build dependencies
        run: |
          apt-get update -y
          apt-get install -y --no-install-recommends \
            live-build debootstrap xorriso squashfs-tools \
            qemu-user-static binfmt-support \
            debian-archive-keyring \
            wget curl git gnupg2 ca-certificates sudo
          update-binfmts --enable qemu-aarch64 2>/dev/null || true
          echo "live-build: $(lb --version)"
          echo "qemu-aarch64-static: $(qemu-aarch64-static --version 2>&1 | head -1)"

      - name: ⚙️ Configure
        run: lb config

      - name: 🏗️ Build ISO
        shell: bash
        run: |
          lb build 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          find . -name "*.iso" 2>/dev/null || echo "No ISO found"
          exit ${EXIT_CODE}

      - name: 📄 Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-arm64
          path: build.log
          retention-days: 5
          if-no-files-found: warn

      - name: 📍 Find ISO
        id: find_iso
        shell: bash
        run: |
          ISO=$(find . -maxdepth 2 -name "*.iso" -type f | head -1)
          [ -z "$ISO" ] && { echo "❌ No ISO found"; ls -lah; exit 1; }
          echo "✅ ISO: $ISO  ($(ls -lh "$ISO" | awk '{print $5}'))"
          cp "$ISO" "$(pwd)/stupix-linux-arm64.iso"
          echo "iso_path=$(pwd)/stupix-linux-arm64.iso" >> $GITHUB_OUTPUT

      # ── Boot tests: arm64 UEFI, software-emulated (no KVM on amd64 host) ─
      - name: 🔧 Install QEMU + AAVMF
        run: apt-get install -y --no-install-recommends qemu-system-arm qemu-efi-aarch64

      - name: 🔍 Boot Test — arm64 UEFI (CD)
        run: bash ci/boot-test.sh "${{ steps.find_iso.outputs.iso_path }}" arm64-cd

      - name: 🔍 Boot Test — arm64 UEFI (USB)
        run: bash ci/boot-test.sh "${{ steps.find_iso.outputs.iso_path }}" arm64-usb

      - name: 📄 Upload Boot Test Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-log-arm64
          path: boot-*.log
          retention-days: 5
          if-no-files-found: warn

      - name: 📦 Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: stupix-linux-arm64
          path: stupix-linux-arm64.iso
          retention-days: 7

  # ── Release: every boot test must pass ────────────────────────────────
  release:
    needs: [build-amd64, build-arm64]
    # No always() — both build jobs must succeed. PRs and branch runs only test.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Download amd64 ISO
        uses: actions/download-artifact@v4
        with:
          name: stupix-linux-amd64
          path: release/

      - name: 📥 Download arm64 ISO
        uses: actions/download-artifact@v4
        with:
          name: stupix-linux-arm64
          path: release/

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.build-amd64.outputs.tag }}
          name: "Stupix Linux ${{ needs.build-amd64.outputs.tag }}"
          body: |
            # Stupix Linux ISO

            Automatically built and boot-tested from commit `${{ github.sha }}`

            **Every boot test passed on the unmodified ISO before this release was published**
            (booted as CD and as USB stick, through to a cloned stupix repo):
            - ✅ amd64 BIOS (SeaBIOS / isolinux)
            - ✅ amd64 UEFI (OVMF / shim + GRUB)
            - ✅ amd64 UEFI with Secure Boot
            - ✅ arm64 UEFI (QEMU_EFI / GRUB)

            ## Downloads

            | File | Architecture | Boot modes |
            |---|---|---|
            | `stupix-linux-amd64.iso` | x86-64 (PC, server) | Legacy BIOS + UEFI |
            | `stupix-linux-arm64.iso` | ARM64 (RPi, ARM server) | UEFI |

            ## Flash to USB

            ```bash
            # Linux (replace sdX — use lsblk to find your USB drive)
            sudo dd if=stupix-linux-amd64.iso of=/dev/sdX bs=4M status=progress && sync

            # macOS
            sudo dd if=stupix-linux-amd64.iso of=/dev/rdiskX bs=4m && sync
            ```

            SSH after ~30 s: `ssh root@<ip>` · Password: `stupix`
          files: release/*.iso
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
