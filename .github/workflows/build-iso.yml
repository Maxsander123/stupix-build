name: Build Stupix ISO

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: debian:bookworm
      options: --privileged

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Install build dependencies
        run: |
          apt-get update -y
          apt-get install -y --no-install-recommends \
            live-build \
            debootstrap \
            xorriso \
            squashfs-tools \
            grub-efi-amd64 \
            grub-efi-amd64-signed \
            shim-signed \
            syslinux-utils \
            debian-archive-keyring \
            wget curl git gnupg2 ca-certificates \
            sudo
          echo "live-build version: $(lb --version)"

      - name: ⚙️ Configure live-build
        run: lb config

      - name: 🏗️ Build ISO
        run: |
          lb build 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "=== Searching for ISO ==="
          find . -name "*.iso" 2>/dev/null || echo "No ISO found"
          exit ${EXIT_CODE}
        shell: bash

      - name: 📄 Upload Build Log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 5
          if-no-files-found: warn

      - name: 📍 Find ISO
        id: find_iso
        run: |
          ISO_PATH=$(find . -maxdepth 2 -name "*.iso" -type f 2>/dev/null | head -1)
          if [ -z "$ISO_PATH" ]; then
            echo "❌ No ISO found!"
            ls -lah
            exit 1
          fi
          echo "✅ ISO found: $ISO_PATH"
          ls -lh "$ISO_PATH"
          DEST="$(pwd)/stupix-linux.iso"
          cp "$ISO_PATH" "$DEST"
          chmod 644 "$DEST"
          echo "iso_path=$DEST" >> $GITHUB_OUTPUT
          ls -lh "$DEST"

      - name: 🏷️ Generate Release Tag
        id: tag
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TAG="v$(date +'%Y.%m.%d')-${SHORT_SHA}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Tag: $TAG"

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Stupix Linux ${{ steps.tag.outputs.tag }}"
          body: |
            # 📦 Stupix Linux ISO
            Automatically built from commit `${{ github.sha }}`
            - **Branch:** ${{ github.ref_name }}
            - **Built on:** ${{ github.event.head_commit.timestamp }}
          files: ${{ steps.find_iso.outputs.iso_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
